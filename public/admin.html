<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị Điều hành Biểu đồ & Tuyến</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      font-size: 12px;
      background-color: #F1F4F9;
      color: #333;
    }
    body { padding: 15px; }

    .panel-custom {
      background: #FFFFFF;
      border: 1px solid #C4D5E5;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      max-width: 1250px;
      min-width: 650px;
      margin: 0 auto 20px auto;
    }
    .panel-heading {
      background: #3B86C4;
      color: #FFFFFF;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body { padding: 18px 20px; }
    .form-grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      row-gap: 14px;
      column-gap: 15px;
      align-items: center;
    }
    .input-combo {
      display: flex;
      gap: 10px;
      max-width: 750px;
      width: 100%;
      align-items: center;
      flex-wrap: wrap;
    }
    .form-control {
      height: 32px;
      padding: 3px 8px;
      font-size: 12px;
      border: 1px solid #CCCCCC;
      border-radius: 3px;
      outline: none;
      width: 100%;
      background-color: #FFFFFF;
    }
    .form-control:focus { border-color: #3B86C4; }
    .form-control[readonly] {
      background-color: #EBF2F8;
      color: #555;
      cursor: not-allowed;
    }
    textarea.form-control {
      height: 140px;
      font-family: monospace;
      max-width: 100%;
    }
    .btn {
      padding: 7px 16px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }
    .btn-success { background-color: #5cb85c; border-color: #4cae4c; }
    .btn-primary { background-color: #337ab7; border-color: #2e6da4; }
    .btn-danger { background-color: #d9534f; border-color: #d43f3a; }
    .btn-warning { background-color: #f0ad4e; border-color: #eea236; }
    .btn-default { background-color: #f0f0f0; border-color: #ccc; color: #333; }
    .btn:hover { opacity: 0.9; }
    .nav-link { color: #fff; text-decoration: none; font-size: 12px; }
    .extra-input { display: none; border-color: #e67e22; background-color: #fffaf0; }

    .radio-group {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    .radio-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
    }

    .table-custom {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    .table-custom th, .table-custom td {
      border: 1px solid #D0D7DE;
      padding: 6px 10px;
      text-align: left;
    }
    .table-custom th {
      background-color: #F1F4F9;
      font-weight: bold;
      color: #333;
    }
    .table-custom tr:hover { background-color: #F8FAFC; }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 11px;
    }
    .status-active { background-color: #E6F4EA; color: #137333; }
    .status-locked { background-color: #FCE8E6; color: #C5221F; }

    .select2-container .select2-selection--single {
      height: 32px !important;
      border: 1px solid #ccc !important;
      border-radius: 3px !important;
      display: flex;
      align-items: center;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
      line-height: 30px !important;
      font-size: 12px !important;
      color: #333 !important;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
      height: 30px !important;
    }
    .select2-dropdown {
      font-size: 12px !important;
      border: 1px solid #3B86C4 !important;
    }
  </style>
</head>
<body>

  <!-- PHẦN 1: XÁC LẬP / ĐIỀU CHUYỂN & THÔNG TIN ĐỘI XE -->
  <div class="panel-custom">
    <div class="panel-heading">
      <div><i class="fa fa-pencil-square-o"></i> 1. Quản trị Thông tin Tuyến & Đội xe</div>
      <div><a href="index.html" class="nav-link"><i class="fa fa-arrow-left"></i> Về trang tra cứu</a></div>
    </div>
    <div class="panel-body">
      <div class="form-grid">
        <label style="color:#d9534f; font-weight:bold;">Chế độ thao tác:</label>
        <div class="input-combo">
          <select id="selChonTuyenDeSua" class="form-control select2-search" style="width: 70%;">
            <option value="">[+ Tạo mới một tuyến hoàn toàn]</option>
          </select>
          <button class="btn btn-default" type="button" onclick="resetFormTuyen()"><i class="fa fa-refresh"></i> Làm mới</button>
        </div>

        <label>Mã tuyến:</label>
        <div class="input-combo">
          <input type="text" id="txtMaTuyen" class="form-control" placeholder="Ví dụ: 83 hoặc TEST01" oninput="tuDongGoiYTenTuyen()" style="max-width: 250px;">
        </div>

        <label>Đơn vị chủ quản:</label>
        <div class="input-combo">
          <div style="flex: 1; min-width: 280px;">
            <select id="selXn" class="form-control select2-search" style="width: 100%;">
              <option value="">Chọn xí nghiệp</option>
            </select>
          </div>
          <input type="text" id="txtXnMoi" class="form-control extra-input" placeholder="Nhập tên Xí nghiệp mới..." style="flex: 1;">
        </div>

        <label>Đầu A:</label>
        <div class="input-combo">
          <div style="flex: 1; min-width: 280px;">
            <select id="selDauA" class="form-control select2-search" style="width: 100%;">
              <option value="">Chọn đầu bến A</option>
            </select>
          </div>
          <input type="text" id="txtDauAMoi" class="form-control extra-input" placeholder="Nhập tên Đầu A mới..." oninput="tuDongGoiYTenTuyen()" style="flex: 1;">
        </div>

        <label>Đầu B:</label>
        <div class="input-combo">
          <div style="flex: 1; min-width: 280px;">
            <select id="selDauB" class="form-control select2-search" style="width: 100%;">
              <option value="">Chọn đầu bến B</option>
            </select>
          </div>
          <input type="text" id="txtDauBMoi" class="form-control extra-input" placeholder="Nhập tên Đầu B mới..." oninput="tuDongGoiYTenTuyen()" style="flex: 1;">
        </div>

        <label>Tên tuyến đầy đủ:</label>
        <div class="input-combo">
          <input type="text" id="txtTenTuyen" class="form-control" placeholder="Hệ thống tự động ghép theo Mã và Đầu bến...">
        </div>

        <!-- THÔNG TIN ĐỘI XE & HOẠT ĐỘNG -->
        <label style="color:#0F86DB; font-weight:bold;">Thông tin phương tiện:</label>
        <div class="input-combo">
          <input type="number" id="txtSoXe" class="form-control" placeholder="Số xe KH (VD: 12)" style="width: 140px;">
          <input type="text" id="txtLoaiXe" class="form-control" placeholder="Loại xe (VD: VinFast EB8)" style="flex: 1;">
          <input type="text" id="txtSucChua" class="form-control" placeholder="Sức chứa (VD: 60 chỗ)" style="width: 150px;">
        </div>

        <label style="color:#e67e22; font-weight:bold;">Trạng thái hoạt động:</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="rdStatus" value="active" checked> <strong style="color:#137333;"><i class="fa fa-check-circle"></i> Đang hoạt động</strong> (Hiện trên tra cứu)</label>
          <label class="radio-item"><input type="radio" name="rdStatus" value="locked"> <strong style="color:#c5221f;"><i class="fa fa-lock"></i> Tạm dừng / Khóa tuyến</strong> (Ẩn khỏi tra cứu)</label>
        </div>

        <div></div>
        <div>
          <button class="btn btn-success" onclick="xacLapTuyen()"><i class="fa fa-save"></i> Lưu thông tin tuyến / Điều chuyển</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PHẦN 2: DÁN VÀ QUẢN LÝ BIỂU ĐỒ CHẠY XE -->
  <div class="panel-custom">
    <div class="panel-heading">
      <div><i class="fa fa-calendar-plus-o"></i> 2. Nhập / Cập nhật / Xóa Biểu đồ chạy xe</div>
    </div>
    <div class="panel-body">
      <div class="form-grid">
        <label>Chọn tuyến:</label>
        <div class="input-combo">
          <select id="selChonTuyen" class="form-control select2-search" style="width: 100%;">
            <option value="">Chọn tuyến</option>
          </select>
        </div>

        <label>Đơn vị chủ quản:</label>
        <div class="input-combo">
          <input type="text" id="txtBieuDoXn" class="form-control" readonly placeholder="Tự động hiển thị theo tuyến...">
        </div>

        <label>Ngày áp dụng:</label>
        <div class="input-combo">
          <input type="text" id="txtNgayApDung" class="form-control" oninput="tuDongTaoTenTab()" placeholder="dd/mm/yyyy (Ví dụ: 08/10/2026)">
        </div>

        <label>Phạm vi ngày:</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="rdPhamVi" value="Cả tuần" checked onchange="tuDongTaoTenTab()"> Cả tuần (T2-CN)</label>
          <label class="radio-item"><input type="radio" name="rdPhamVi" value="Thứ 2 - Thứ 7" onchange="tuDongTaoTenTab()"> Thứ 2 - Thứ 7 (T2-T7)</label>
          <label class="radio-item"><input type="radio" name="rdPhamVi" value="Chủ nhật" onchange="tuDongTaoTenTab()"> Chủ nhật (CN)</label>
        </div>

        <label>Tên tab nhận diện:</label>
        <div class="input-combo">
          <input type="text" id="txtTenTab" class="form-control" readonly placeholder="Hệ thống tự động ghép...">
        </div>

        <label>Dữ liệu giờ (Excel / Tab):</label>
        <textarea id="txtRawData" class="form-control" placeholder="Copy cả bảng từ Excel/Sheets dán vào đây..."></textarea>

        <div></div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <button class="btn btn-primary" onclick="luuBieuDo()"><i class="fa fa-upload"></i> Lưu biểu đồ vào hệ thống</button>
          <button class="btn btn-danger" type="button" onclick="xoaBieuDo()"><i class="fa fa-trash"></i> Xóa biểu đồ này</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PHẦN 3: BẢNG THEO DÕI TỔNG QUAN TẤT CẢ CÁC TUYẾN -->
  <div class="panel-custom">
    <div class="panel-heading">
      <div><i class="fa fa-list"></i> 3. Danh sách Tuyến & Trạng thái hoạt động</div>
    </div>
    <div class="panel-body">
      <div style="overflow-x: auto;">
        <table class="table-custom">
          <thead>
            <tr>
              <th style="width: 60px; text-align: center;">Mã</th>
              <th>Tên Tuyến</th>
              <th>Đơn vị chủ quản</th>
              <th>Phương tiện</th>
              <th style="width: 140px; text-align: center;">Trạng thái</th>
              <th style="width: 150px; text-align: center;">Hành động</th>
            </tr>
          </thead>
          <tbody id="tblDanhSachTuyen">
            <!-- Tự động nạp danh sách -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let rawDanhMuc = [];
    let dsXn = new Set();
    let dsDauBen = new Set();
    let mapTuyenChiTiet = new Map();
    let dangLamMoi = false;

    $(document).ready(function() {
      $('.select2-search').select2({
        language: { noResults: () => "Không tìm thấy kết quả phù hợp" }
      });

      $('#selXn').on('change', () => toggleExtraInput('selXn', 'txtXnMoi'));
      $('#selDauA').on('change', () => { toggleExtraInput('selDauA', 'txtDauAMoi'); tuDongGoiYTenTuyen(); });
      $('#selDauB').on('change', () => { toggleExtraInput('selDauB', 'txtDauBMoi'); tuDongGoiYTenTuyen(); });
      
      $('#selChonTuyenDeSua').on('change', onChonTuyenDeSuaChange);
      $('#selChonTuyen').on('change', onSelectTuyenChange);

      napDuLieuTong();
    });

    function toggleExtraInput(selectId, inputId) {
      const val = $('#' + selectId).val();
      const $inp = $('#' + inputId);
      if (val === "__NEW__") {
        $inp.show().focus();
      } else {
        $inp.hide().val("");
      }
    }

    function resetFormTuyen() {
      dangLamMoi = true;
      $('#selChonTuyenDeSua').val("").trigger('change.select2');
      $('#txtMaTuyen').val("").prop('readonly', false);
      $('#selXn').val("").trigger('change.select2');
      $('#selDauA').val("").trigger('change.select2');
      $('#selDauB').val("").trigger('change.select2');
      $('#txtTenTuyen').val("");
      $('#txtSoXe').val("");
      $('#txtLoaiXe').val("");
      $('#txtSucChua').val("");
      $('input[name="rdStatus"][value="active"]').prop('checked', true);
      $('#txtXnMoi, #txtDauAMoi, #txtDauBMoi').hide().val("");
      dangLamMoi = false;
    }

    function onChonTuyenDeSuaChange() {
      if (dangLamMoi) return;
      const ma = $('#selChonTuyenDeSua').val();
      if (!ma) {
        resetFormTuyen();
        return;
      }
      
      const t = mapTuyenChiTiet.get(ma);
      if (t) {
        $('#txtMaTuyen').val(t.maTuyen).prop('readonly', true);
        $('#txtTenTuyen').val(t.tenTuyen);
        $('#txtSoXe').val(t.soXe || "");
        $('#txtLoaiXe').val(t.loaiXe || "");
        $('#txtSucChua').val(t.sucChua || "");
        $(`input[name="rdStatus"][value="${t.status || 'active'}"]`).prop('checked', true);

        $('#selXn').val(t.xn).trigger('change.select2');
        $('#selDauA').val(t.dauA).trigger('change.select2');
        $('#selDauB').val(t.dauB).trigger('change.select2');
      }
    }

    function tuDongGoiYTenTuyen() {
      const ma = $('#txtMaTuyen').val().trim();
      const selA = $('#selDauA').val();
      const dauA = selA === "__NEW__" ? $('#txtDauAMoi').val().trim() : selA;

      const selB = $('#selDauB').val();
      const dauB = selB === "__NEW__" ? $('#txtDauBMoi').val().trim() : selB;

      if (ma && dauA && dauB) {
        $('#txtTenTuyen').val(`${ma}. ${dauA} - ${dauB}`);
      }
    }

    async function napDuLieuTong(chonMaTuyenMoi = '') {
      try {
        const res = await fetch('/api/danh-muc?admin=true');
        const data = await res.json();
        rawDanhMuc = data.data || [];
        const allRoutes = data.allRoutes || [];

        dsXn.clear();
        dsDauBen.clear();
        mapTuyenChiTiet.clear();

        allRoutes.forEach(t => {
          if (t.xn) dsXn.add(t.xn);
          if (t.dauA) dsDauBen.add(t.dauA);
          if (t.dauB) dsDauBen.add(t.dauB);
          if (t.maTuyen) {
            mapTuyenChiTiet.set(t.maTuyen, t);
          }
        });

        rawDanhMuc.forEach(item => {
          if (item.xn) dsXn.add(item.xn);
          const parts = (item.tuyen || '').split('-');
          if (parts.length >= 2) {
            const a = parts[0].replace(/^[0-9A-Za-z]+\.\s*/, '').trim();
            const b = parts[1].trim();
            if (a) dsDauBen.add(a);
            if (b) dsDauBen.add(b);
          }
        });

        doVaoSelect2("selXn", dsXn, "xí nghiệp");
        doVaoSelect2("selDauA", dsDauBen, "đầu bến A");
        doVaoSelect2("selDauB", dsDauBen, "đầu bến B");

        const $selSua = $('#selChonTuyenDeSua');
        $selSua.empty().append('<option value="">[+ Tạo mới một tuyến hoàn toàn]</option>');
        mapTuyenChiTiet.forEach(t => {
          const lockText = t.status === 'locked' ? ' [ĐÃ KHÓA]' : '';
          $selSua.append(new Option(`${t.maTuyen} - ${t.tenTuyen}${lockText}`, t.maTuyen));
        });
        $selSua.trigger('change.select2');

        const $selTuyen = $('#selChonTuyen');
        $selTuyen.empty().append('<option value="">Chọn tuyến</option>');
        
        let selectedVal = "";
        mapTuyenChiTiet.forEach(t => {
          const isSelected = chonMaTuyenMoi && (t.maTuyen === chonMaTuyenMoi);
          if (isSelected) selectedVal = t.tenTuyen;
          const opt = new Option(t.tenTuyen, t.tenTuyen, false, false);
          $(opt).attr('data-xn', t.xn);
          $selTuyen.append(opt);
        });

        if (selectedVal) $selTuyen.val(selectedVal);
        $selTuyen.trigger('change.select2');

        veBangDanhSachTuyen();
      } catch (err) {
        console.error("Lỗi nạp dữ liệu:", err);
      }
    }

    function veBangDanhSachTuyen() {
      let html = '';
      if (mapTuyenChiTiet.size === 0) {
        html = '<tr><td colspan="6" style="text-align:center; color:#999; padding:15px;">Chưa có tuyến xe nào trong hệ thống!</td></tr>';
      } else {
        mapTuyenChiTiet.forEach(t => {
          const isLocked = t.status === 'locked';
          const badge = isLocked 
            ? '<span class="status-badge status-locked"><i class="fa fa-lock"></i> Đã khóa / Dừng</span>' 
            : '<span class="status-badge status-active"><i class="fa fa-check"></i> Đang chạy</span>';
          
          const thongTinXe = (t.soXe || t.loaiXe) 
            ? `${t.soXe ? t.soXe + ' xe' : ''} ${t.loaiXe ? '- ' + t.loaiXe : ''} ${t.sucChua ? '(' + t.sucChua + ')' : ''}`
            : '<span style="color:#aaa;">Chưa cập nhật</span>';

          const btnToggle = isLocked
            ? `<button class="btn btn-success" style="padding:3px 8px; font-size:11px;" onclick="doiTrangThai('${t.maTuyen}', 'active')"><i class="fa fa-unlock"></i> Mở lại</button>`
            : `<button class="btn btn-warning" style="padding:3px 8px; font-size:11px;" onclick="doiTrangThai('${t.maTuyen}', 'locked')"><i class="fa fa-lock"></i> Khóa</button>`;

          html += `
            <tr>
              <td style="text-align: center; font-weight: bold; color: #3B86C4;">${t.maTuyen}</td>
              <td><strong>${t.tenTuyen}</strong></td>
              <td>${t.xn || '-'}</td>
              <td>${thongTinXe}</td>
              <td style="text-align: center;">${badge}</td>
              <td style="text-align: center;">
                <div style="display:flex; gap:5px; justify-content:center;">
                  <button class="btn btn-default" style="padding:3px 8px; font-size:11px;" onclick="napTuyenLenSua('${t.maTuyen}')"><i class="fa fa-pencil"></i> Sửa</button>
                  ${btnToggle}
                </div>
              </td>
            </tr>
          `;
        });
      }
      $('#tblDanhSachTuyen').html(html);
    }

    function napTuyenLenSua(maTuyen) {
      $('#selChonTuyenDeSua').val(maTuyen).trigger('change');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function doiTrangThai(maTuyen, statusMoi) {
      const tenStatus = statusMoi === 'locked' ? 'KHÓA (tạm dừng)' : 'MỞ LẠI';
      if (!confirm(`Bạn có chắc chắn muốn ${tenStatus} hoạt động của tuyến [${maTuyen}]?`)) return;

      try {
        const res = await fetch('/api/toggle-status-tuyen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ maTuyen, status: statusMoi })
        });
        const data = await res.json();
        alert(data.message);
        await napDuLieuTong();
      } catch (e) {
        alert("Lỗi: " + e);
      }
    }

    function doVaoSelect2(elemId, dataSet, label) {
      const $sel = $('#' + elemId);
      $sel.empty().append(`<option value="">Chọn ${label}</option>`);
      Array.from(dataSet).sort().forEach(val => {
        $sel.append(new Option(val, val));
      });
      $sel.append(new Option(`[+ Thêm ${label} mới...]`, "__NEW__"));
      $sel.trigger('change.select2');
    }

    function onSelectTuyenChange() {
      const opt = $('#selChonTuyen').find(':selected');
      const xn = opt.attr('data-xn') || "";
      $('#txtBieuDoXn').val(xn);
      tuDongTaoTenTab();
    }

    function tuDongTaoTenTab() {
      const tuyen = $('#selChonTuyen').val();
      const ngay = $('#txtNgayApDung').val().trim();
      const phamVi = $('input[name="rdPhamVi"]:checked').val() || "Cả tuần";
      const $tabInp = $('#txtTenTab');

      if (!tuyen) {
        $tabInp.val("");
        return;
      }

      const match = tuyen.match(/^([A-Za-z0-9]+)/);
      const maTuyenNgan = match ? match[1] : tuyen;

      if (ngay) {
        const ngayFormat = ngay.replace(/\//g, '.');
        $tabInp.val(`${maTuyenNgan} (${ngayFormat} - ${phamVi})`);
      } else {
        $tabInp.val(`${maTuyenNgan} (${phamVi})`);
      }
    }

    async function xacLapTuyen() {
      const maTuyen = $('#txtMaTuyen').val().trim();
      const selXnVal = $('#selXn').val();
      const xn = selXnVal === "__NEW__" ? $('#txtXnMoi').val().trim() : selXnVal;

      const selAVal = $('#selDauA').val();
      const dauA = selAVal === "__NEW__" ? $('#txtDauAMoi').val().trim() : selAVal;

      const selBVal = $('#selDauB').val();
      const dauB = selBVal === "__NEW__" ? $('#txtDauBMoi').val().trim() : selBVal;

      const tenTuyen = $('#txtTenTuyen').val().trim();
      const soXe = $('#txtSoXe').val().trim();
      const loaiXe = $('#txtLoaiXe').val().trim();
      const sucChua = $('#txtSucChua').val().trim();
      const status = $('input[name="rdStatus"]:checked').val() || 'active';

      if (!maTuyen || !tenTuyen || !xn) {
        alert("Vui lòng điền đủ Mã tuyến, Đơn vị chủ quản và Tên tuyến!");
        return;
      }

      try {
        const res = await fetch('/api/tuyen-moi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ maTuyen, tenTuyen, xn, dauA, dauB, soXe, loaiXe, sucChua, status })
        });
        const data = await res.json();
        alert(data.message);

        await napDuLieuTong(maTuyen);
        resetFormTuyen();
      } catch (err) {
        alert("Lỗi kết nối: " + err);
      }
    }

    async function luuBieuDo() {
      const tuyen = $('#selChonTuyen').val();
      const xn = $('#txtBieuDoXn').val();
      const ngayApDung = $('#txtNgayApDung').val().trim();
      const phamVi = $('input[name="rdPhamVi"]:checked').val() || "Cả tuần";
      const tenTab = $('#txtTenTab').val().trim();
      const rawText = $('#txtRawData').val().trim();

      if (!tuyen) { alert("Vui lòng chọn Tuyến cần gán biểu đồ!"); return; }
      if (!ngayApDung || !rawText) { alert("Vui lòng điền Ngày áp dụng (dd/mm/yyyy) và dán Dữ liệu giờ!"); return; }

      const lines = rawText.split("\n");
      const rawData = [];
      let maxCols = 0;

      for (let i = 0; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const cols = lines[i].split("\t");
        if (cols.length > maxCols) maxCols = cols.length;
        rawData.push(cols);
      }

      for (let j = 0; j < rawData.length; j++) {
        while (rawData[j].length < maxCols) rawData[j].push("");
      }

      const bieuDo = `${ngayApDung} (${phamVi})`;

      try {
        const res = await fetch('/api/luu-bieu-do', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ xn, tuyen, bieuDo, tenTab, rawData, ngayApDung, phamVi })
        });
        const data = await res.json();
        alert(data.message);
        $('#txtRawData').val("");
      } catch (err) {
        alert("Lỗi khi lưu biểu đồ: " + err);
      }
    }

    async function xoaBieuDo() {
      const tenTab = $('#txtTenTab').val().trim();
      if (!tenTab) {
        alert("Vui lòng chọn Tuyến và Ngày áp dụng để xác định biểu đồ cần xóa!");
        return;
      }

      if (!confirm(`Bạn có chắc chắn muốn XÓA VĨNH VIỄN biểu đồ [${tenTab}] khỏi hệ thống không?`)) {
        return;
      }

      try {
        const res = await fetch('/api/xoa-bieu-do', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tenTab })
        });
        const data = await res.json();
        alert(data.message);

        if (data.success) {
          await napDuLieuTong();
          $('#txtRawData').val("");
          $('#txtNgayApDung').val("");
          tuDongTaoTenTab();
        }
      } catch (err) {
        alert("Lỗi kết nối khi xóa: " + err);
      }
    }
  </script>
