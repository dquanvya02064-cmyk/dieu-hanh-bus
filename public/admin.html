<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <!-- Cho phép phóng to thu nhỏ và cuộn ngang tự do -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị Hệ thống Biểu đồ Xe buýt</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Cho phép toàn bộ trang web cuộn ngang mượt mà */
    html, body {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #F1F4F9;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      font-size: 12px;
      color: #333;
    }

    body {
      padding: 12px;
    }

    /* Đặt độ rộng tối thiểu để trên điện thoại giữ nguyên form chuẩn và tự động cho cuộn ngang */
    .container {
      width: 100%;
      min-width: 650px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .panel-custom {
      background: #FFFFFF;
      border: 1px solid #C4D5E5;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      width: 100%;
    }

    .panel-heading {
      background: #3B86C4;
      color: #FFFFFF;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-heading a {
      color: #FFF;
      text-decoration: none;
      font-size: 12px;
      font-weight: normal;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .panel-body { padding: 16px 20px; }

    /* Giữ nguyên dạng 2 cột rộng rãi */
    .form-grid {
      display: grid;
      grid-template-columns: 150px 1fr;
      row-gap: 12px;
      column-gap: 15px;
      align-items: center;
      margin-bottom: 15px;
    }

    .form-control {
      height: 34px;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #CCCCCC;
      border-radius: 3px;
      outline: none;
      background-color: #FFFFFF;
      width: 100%;
      max-width: 500px;
    }
    .form-control:focus { border-color: #3B86C4; }

    .vehicle-group {
      display: flex;
      gap: 10px;
      max-width: 500px;
      width: 100%;
    }
    .vehicle-group input {
      flex: 1;
      min-width: 0;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .radio-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
    }

    .btn {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
    }

    .btn-primary { background-color: #337AB7; color: #FFF; border-color: #2E6DA4; }
    .btn-primary:hover { background-color: #286090; }

    .btn-success { background-color: #5CB85C; color: #FFF; border-color: #4CAE4C; }
    .btn-success:hover { background-color: #449D44; }

    .btn-danger { background-color: #D9534F; color: #FFF; border-color: #D43F3A; }
    .btn-danger:hover { background-color: #C9302C; }

    .btn-default { background-color: #E6E6E6; color: #333; border-color: #ADADAD; }
    .btn-default:hover { background-color: #D4D4D4; }

    .select2-container { width: 100% !important; max-width: 500px !important; }
    .select2-container .select2-selection--single {
      height: 34px !important;
      border: 1px solid #ccc !important;
      border-radius: 3px !important;
      display: flex;
      align-items: center;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
      line-height: 32px !important;
      font-size: 12px !important;
      color: #333 !important;
      padding-left: 8px !important;
      padding-right: 20px !important;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
      height: 32px !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- PANEL 1: QUẢN TRỊ THÔNG TIN TUYẾN -->
    <div class="panel-custom">
      <div class="panel-heading">
        <div><i class="fa fa-edit"></i> 1. QUẢN TRỊ THÔNG TIN TUYẾN & ĐỘI XE</div>
        <div><a href="index.html"><i class="fa fa-arrow-left"></i> VỀ TRANG TRA CỨU</a></div>
      </div>
      <div class="panel-body">
        <div class="form-grid">
          <label style="color: #D9534F;">Chế độ thao tác:</label>
          <div style="max-width: 500px; display: flex; flex-direction: column; gap: 8px;">
            <select id="selRouteManage" class="form-control select2-search" style="width: 100%;">
              <option value="">-- Chọn tuyến để chỉnh sửa --</option>
            </select>
            <button class="btn btn-default" onclick="resetFormTuyen()" style="align-self: flex-start;"><i class="fa fa-refresh"></i> Làm mới</button>
          </div>

          <label>Mã tuyến:</label>
          <div><input type="text" id="txtMaTuyen" class="form-control" placeholder="VD: 14CT, 01, E01..."></div>

          <label>Đơn vị chủ quản:</label>
          <div><input type="text" id="txtDonVi" class="form-control" placeholder="VD: XN Xe Khách Nam Hà Nội"></div>

          <label>Đầu A:</label>
          <div><input type="text" id="txtDauA" class="form-control" placeholder="Tên bến đầu A"></div>

          <label>Đầu B:</label>
          <div><input type="text" id="txtDauB" class="form-control" placeholder="Tên bến đầu B"></div>

          <label>Tên tuyến đầy đủ:</label>
          <div><input type="text" id="txtTenTuyen" class="form-control" placeholder="VD: 14CT. Trần Khánh Dư - Cổ Nhuế"></div>

          <label style="color: #337AB7;">Thông tin phương tiện:</label>
          <div class="vehicle-group">
            <input type="text" id="txtSoXe" class="form-control" placeholder="Số xe KH (VD: 12)">
            <input type="text" id="txtLoaiXe" class="form-control" placeholder="Loại xe (VD: Daewoo BC095)">
            <input type="text" id="txtSucChua" class="form-control" placeholder="Sức chứa (VD: 60 chỗ)">
          </div>

          <label style="color: #F0AD4E;">Trạng thái hoạt động:</label>
          <div class="radio-group">
            <label class="radio-item"><input type="radio" name="rdStatus" value="active" checked> <span style="color: green; font-weight: bold;"><i class="fa fa-check-circle"></i> Đang hoạt động</span></label>
            <label class="radio-item"><input type="radio" name="rdStatus" value="locked"> <span style="color: red; font-weight: bold;"><i class="fa fa-lock"></i> Tạm dừng / Khóa tuyến</span></label>
          </div>

          <div></div>
          <div>
            <button class="btn btn-success" onclick="luuThongTinTuyen()"><i class="fa fa-save"></i> Lưu thông tin tuyến / Điều chỉnh</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PANEL 2: NHẬP / CẬP NHẬT BIỂU ĐỒ -->
    <div class="panel-custom">
      <div class="panel-heading">
        <div><i class="fa fa-calendar"></i> 2. NHẬP / CẬP NHẬT / XÓA BIỂU ĐỒ CHẠY XE</div>
      </div>
      <div class="panel-body">
        <div class="form-grid">
          <label>Chọn tuyến:</label>
          <div>
            <select id="selRouteBieuDo" class="form-control select2-search" style="width: 100%;" onchange="onRouteBieuDoChange()">
              <option value="">Chọn tuyến</option>
            </select>
          </div>

          <label>Đơn vị chủ quản:</label>
          <div><input type="text" id="txtXnBieuDo" class="form-control" readonly placeholder="Tự động hiển thị theo tuyến.."></div>

          <label>Tên Tab / Tên biểu đồ:</label>
          <div><input type="text" id="txtTenTab" class="form-control" placeholder="VD: 14CT (1.4.26) hoặc 25 (2-7, 1.4.25)"></div>

          <label>Loại ngày:</label>
          <div>
            <select id="selLoaiNgay" class="form-control">
              <option value="Cả tuần">Cả tuần</option>
              <option value="Ngày thường">Ngày thường (Thứ 2 - Thứ 7)</option>
              <option value="Chủ nhật">Chủ nhật</option>
            </select>
          </div>

          <label>Dữ liệu bảng (JSON Array):</label>
          <div>
            <textarea id="txtRawData" class="form-control" style="height: 120px; font-family: monospace;" placeholder="Dán mảng rawData [[...], [...]] vào đây..."></textarea>
          </div>

          <div></div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="luuBieuDo()"><i class="fa fa-upload"></i> Cập nhật / Thêm Biểu đồ</button>
            <button class="btn btn-danger" onclick="xoaBieuDo()"><i class="fa fa-trash"></i> Xóa Biểu đồ này</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let fullData = { tuyenList: {}, bieuDoList: [] };

    $(document).ready(function() {
      $('.select2-search').select2();
      taiDuLieu();

      $('#selRouteManage').on('change', function() {
        const ma = $(this).val();
        if (!ma || !fullData.tuyenList[ma]) {
          resetFormTuyen();
          return;
        }
        const t = fullData.tuyenList[ma];
        $('#txtMaTuyen').val(t.maTuyen || ma);
        $('#txtDonVi').val(t.xn || "");
        $('#txtDauA').val(t.dauA || "");
        $('#txtDauB').val(t.dauB || "");
        $('#txtTenTuyen').val(t.tenTuyen || "");
        $('#txtSoXe').val(t.soXe || "");
        $('#txtLoaiXe').val(t.loaiXe || "");
        $('#txtSucChua').val(t.sucChua || "");
        $(`input[name="rdStatus"][value="${t.status || 'active'}"]`).prop('checked', true);
      });
    });

    async function taiDuLieu() {
      try {
        const res = await fetch('/api/bus-data').then(r => r.json());
        fullData = res || { tuyenList: {}, bieuDoList: [] };
        if (!fullData.tuyenList) fullData.tuyenList = {};
        if (!fullData.bieuDoList) fullData.bieuDoList = [];

        napSelectTuyen();
      } catch (err) {
        alert("Lỗi tải dữ liệu máy chủ: " + err);
      }
    }

    function napSelectTuyen() {
      const $s1 = $('#selRouteManage');
      const $s2 = $('#selRouteBieuDo');

      $s1.empty().append('<option value="">-- Chọn tuyến để chỉnh sửa --</option>');
      $s2.empty().append('<option value="">Chọn tuyến</option>');

      const keys = Object.keys(fullData.tuyenList).sort();
      keys.forEach(k => {
        const item = fullData.tuyenList[k];
        const text = `${k} - ${item.tenTuyen || k}`;
        $s1.append(new Option(text, k));
        $s2.append(new Option(text, k));
      });

      $s1.trigger('change');
      $s2.trigger('change');
    }

    function resetFormTuyen() {
      $('#selRouteManage').val('').trigger('change');
      $('#txtMaTuyen').val('');
      $('#txtDonVi').val('');
      $('#txtDauA').val('');
      $('#txtDauB').val('');
      $('#txtTenTuyen').val('');
      $('#txtSoXe').val('');
      $('#txtLoaiXe').val('');
      $('#txtSucChua').val('');
      $('input[name="rdStatus"][value="active"]').prop('checked', true);
    }

    function onRouteBieuDoChange() {
      const k = $('#selRouteBieuDo').val();
      if (k && fullData.tuyenList[k]) {
        $('#txtXnBieuDo').val(fullData.tuyenList[k].xn || "");
      } else {
        $('#txtXnBieuDo').val("");
      }
    }

    async function luuThongTinTuyen() {
      const ma = $('#txtMaTuyen').val().trim();
      if (!ma) {
        alert("Vui lòng nhập Mã tuyến!");
        return;
      }

      fullData.tuyenList[ma] = {
        maTuyen: ma,
        xn: $('#txtDonVi').val().trim(),
        tenTuyen: $('#txtTenTuyen').val().trim() || `${ma}. Tuyến ${ma}`,
        dauA: $('#txtDauA').val().trim(),
        dauB: $('#txtDauB').val().trim(),
        soXe: $('#txtSoXe').val().trim(),
        loaiXe: $('#txtLoaiXe').val().trim(),
        sucChua: $('#txtSucChua').val().trim(),
        status: $('input[name="rdStatus"]:checked').val() || "active"
      };

      await luuLenServer("Đã lưu thông tin tuyến thành công!");
      napSelectTuyen();
    }

    async function luuBieuDo() {
      const k = $('#selRouteBieuDo').val();
      const tenTab = $('#txtTenTab').val().trim();
      const rawText = $('#txtRawData').val().trim();

      if (!k || !tenTab || !rawText) {
        alert("Vui lòng điền đủ Tuyến, Tên Tab và Dữ liệu mảng JSON!");
        return;
      }

      let parsedRaw = [];
      try {
        parsedRaw = JSON.parse(rawText);
        if (!Array.isArray(parsedRaw)) throw new Error("Dữ liệu phải là mảng 2 chiều");
      } catch (e) {
        alert("Dữ liệu bảng JSON không hợp lệ: " + e.message);
        return;
      }

      const tuyenItem = fullData.tuyenList[k] || {};
      const newBieuDo = {
        xn: tuyenItem.xn || $('#txtXnBieuDo').val().trim(),
        tuyen: tuyenItem.tenTuyen || k,
        bieuDo: $('#selLoaiNgay').val(),
        tenTab: tenTab,
        rawData: parsedRaw
      };

      const idx = fullData.bieuDoList.findIndex(b => b.tenTab === tenTab);
      if (idx >= 0) {
        fullData.bieuDoList[idx] = newBieuDo;
      } else {
        fullData.bieuDoList.push(newBieuDo);
      }

      await luuLenServer("Đã lưu Biểu đồ chạy xe thành công!");
    }

    async function xoaBieuDo() {
      const tenTab = $('#txtTenTab').val().trim();
      if (!tenTab) {
        alert("Vui lòng nhập Tên Tab muốn xóa!");
        return;
      }
      if (!confirm(`Bạn có chắc muốn xóa biểu đồ "${tenTab}"?`)) return;

      fullData.bieuDoList = fullData.bieuDoList.filter(b => b.tenTab !== tenTab);
      await luuLenServer("Đã xóa Biểu đồ thành công!");
    }

    async function luuLenServer(msg) {
      try {
        const res = await fetch('/api/bus-data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(fullData)
        }).then(r => r.json());

        if (res && res.success) {
          alert(msg);
        } else {
          alert("Lỗi: " + (res.message || "Không lưu được"));
        }
      } catch (err) {
        alert("Lỗi kết nối máy chủ: " + err);
      }
    }
  </script>
</body>
</html>
