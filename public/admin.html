async function getRawData() {
  const doc = await BusModel.findOne({ key: 'main_data' });
  if (doc && doc.data && doc.data.tuyenList && Object.keys(doc.data.tuyenList).length > 0) {
    if (!Array.isArray(doc.data.danhSachXe)) doc.data.danhSachXe = [];
    return doc.data;
  }
  const localPath = path.join(__dirname, 'bus_full_data.json');
  if (fs.existsSync(localPath)) {
    const fileData = JSON.parse(fs.readFileSync(localPath, 'utf8'));
    if (!Array.isArray(fileData.danhSachXe)) fileData.danhSachXe = [];
    return fileData;
  }
  return { tuyenList: {}, bieuDoList: [], danhSachXe: [] };
}

async function saveRawData(data) {
  if (!Array.isArray(data.danhSachXe)) data.danhSachXe = [];
  await BusModel.findOneAndUpdate(
    { key: 'main_data' },
    { key: 'main_data', data: data },
    { upsert: true, returnDocument: 'after' }
  );
}

app.get('/api/danh-muc', async (req, res) => {
  try {
    const isAdmin = req.query.admin === 'true';
    const raw = await getRawData();
    let danhMucList = [];
    let allRoutesList = [];

    const activeRouteNames = new Set();

    if (raw.tuyenList && typeof raw.tuyenList === 'object') {
      for (let k in raw.tuyenList) {
        const item = raw.tuyenList[k];
        const isLocked = item.status === 'locked';

        if (isAdmin || !isLocked) {
          activeRouteNames.add(item.tenTuyen || k);
          allRoutesList.push({
            maTuyen: item.maTuyen || k,
            tenTuyen: item.tenTuyen || k,
            xn: item.xn || "",
            dauA: item.dauA || "",
            dauB: item.dauB || "",
            soXeVd: item.soXeVd || item.soXe || "",
            soXeKh: item.soXeKh || item.soXe || "",
            soXe: item.soXe || "",
            loaiXe: item.loaiXe || "",
            sucChua: item.sucChua || "",
            status: item.status || "active"
          });
        }
      }
    }

    if (Array.isArray(raw.bieuDoList)) {
      danhMucList = raw.bieuDoList
        .filter(item => isAdmin || activeRouteNames.has(item.tuyen))
        .map(item => ({
          xn: item.xn || "",
          tuyen: item.tuyen || "",
          bieuDo: item.bieuDo || "",
          tenTab: item.tenTab || ""
        }));
    }

    res.json({
      success: true,
      data: danhMucList,
      allRoutes: allRoutesList
    });
  } catch (err) {
    console.error(err);
    res.status(500).json({ success: false, message: 'Lỗi khi tải danh mục: ' + err.message });
  }
});

app.get('/api/table-data', async (req, res) => {
  try {
    const { tab, tuyen } = req.query;
    const raw = await getRawData();

    let foundItem = null;
    if (Array.isArray(raw.bieuDoList)) {
      foundItem = raw.bieuDoList.find(b => {
        const matchTab = String(b.tenTab || '').trim() === String(tab || '').trim();
        const matchTuyen = !tuyen || String(b.tuyen || '').trim() === String(tuyen || '').trim();
        return matchTab && matchTuyen;
      });

      if (!foundItem && tab) {
        foundItem = raw.bieuDoList.find(b => String(b.tenTab || '').trim() === String(tab || '').trim());
      }
    }

    if (!foundItem) {
      return res.status(404).json({ success: false, message: 'Không tìm thấy dữ liệu biểu đồ' });
    }

    let customDauA = "";
    let customDauB = "";
    if (raw.tuyenList) {
      for (let k in raw.tuyenList) {
        const t = raw.tuyenList[k];
        if (t.tenTuyen === foundItem.tuyen || t.tenTuyen === tuyen) {
          customDauA = t.dauA || "";
          customDauB = t.dauB || "";
          break;
        }
      }
    }

    res.json({
      success: true,
      rawData: foundItem.rawData || [],
      dauA: customDauA,
      dauB: customDauB
    });
  } catch (err) {
    console.error(err);
    res.status(500).json({ success: false, message: 'Lỗi nạp bảng biểu đồ: ' + err.message });
  }
});

app.post(['/api/save-tuyen', '/api/tuyen-moi'], async (req, res) => {
  try {
    const { maTuyen, tenTuyen, xn, dauA, dauB, soXeVd, soXeKh, soXe, loaiXe, sucChua, status } = req.body;

      xn: xn || "",
      dauA: dauA || "",
      dauB: dauB || "",
      soXeVd: soXeVd || soXe || "",
      soXeKh: soXeKh || soXe || "",
      soXe: soXeKh || soXeVd || soXe || "",
      loaiXe: loaiXe || "",
      sucChua: sucChua || "",
      status: status || oldStatus
    };

    await saveRawData(raw);
    res.json({ success: true, message: `Lưu thông tin tuyến [${maTuyen}] thành công!` });
  } catch (err) {
    console.error(err);

  }
});

// 7. API LƯU BIỂU ĐỒ (TỰ ĐỘNG ĐẾM NỐT ĐỂ TÍNH XE VẬN DOANH)
app.post('/api/luu-bieu-do', async (req, res) => {
  try {
    const { xn, tuyen, bieuDo, tenTab, rawData } = req.body;
    if (!tenTab || !rawData) {
      return res.status(400).json({ success: false, message: 'Thiếu tên tab hoặc dữ liệu bảng!' });
    }

    const raw = await getRawData();
    if (!Array.isArray(raw.bieuDoList)) raw.bieuDoList = [];

    const newTabObj = {
      xn: xn || "",
      tuyen: tuyen || "",
      bieuDo: bieuDo || "Cả tuần",
      tenTab: tenTab,
      rawData: rawData
    };

    const idx = raw.bieuDoList.findIndex(b => String(b.tenTab || '').trim() === String(tenTab).trim());
    if (idx >= 0) {
      raw.bieuDoList[idx] = newTabObj;
    } else {
      raw.bieuDoList.push(newTabObj);
    }

    // Tự động quét số nốt lớn nhất trong biểu đồ để cập nhật soXeVd
    let maxNot = 0;
    if (Array.isArray(rawData)) {
      rawData.forEach(row => {
        const val = parseInt(String(row[0] || '').trim(), 10);
        if (!isNaN(val) && val > maxNot) maxNot = val;
      });
    }

    if (maxNot > 0 && raw.tuyenList) {
      for (let k in raw.tuyenList) {
        if (raw.tuyenList[k].tenTuyen === tuyen) {
          raw.tuyenList[k].soXeVd = maxNot;
          break;
        }
      }
    }

    await saveRawData(raw);
    res.json({ success: true, message: `Lưu biểu đồ [${tenTab}] thành công! Đã tự động cập nhật ${maxNot > 0 ? maxNot : 'không đổi'} xe vận doanh.` });
  } catch (err) {
    console.error(err);
    res.status(500).json({ success: false, message: 'Lỗi lưu biểu đồ: ' + err.message });
  }
});

// 10. API TRA CỨU XE THEO BIỂN SỐ HOẶC TUYẾN
app.get('/api/tim-kiem-xe', async (req, res) => {
  try {
    const q = (req.query.q || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    const maTuyen = (req.query.tuyen || '').trim().toUpperCase();
    const raw = await getRawData();
    const danhSachXe = raw.danhSachXe || [];

    let ketQua = [];
    if (maTuyen) {
      ketQua = danhSachXe.filter(x => String(x.maTuyen || '').toUpperCase() === maTuyen);
    } else if (q) {
      ketQua = danhSachXe.filter(x => {
        const cleanBks = String(x.bks || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        return cleanBks.includes(q);
      });
    }

    // Gắn thêm tên tuyến và xí nghiệp tương ứng
    const tuyenMap = raw.tuyenList || {};
    ketQua = ketQua.map(x => {
      const t = tuyenMap[x.maTuyen];
      return {
        ...x,
        tenTuyen: t ? t.tenTuyen : `Tuyến ${x.maTuyen}`,
        xn: t ? t.xn : ''
      };
    });

    res.json({ success: true, data: ketQua });
  } catch (err) {
    res.status(500).json({ success: false, message: 'Lỗi tìm xe: ' + err.message });
  }
});

// 11. API NẠP DANH SÁCH XE HÀNG LOẠT TỪ EXCEL (MỞ TUYẾN MỚI NẾU CHƯA CÓ + CẬP NHẬT XE KH)
app.post('/api/import-danh-sach-xe', async (req, res) => {
  try {
    const { rawText } = req.body;
    if (!rawText) return res.status(400).json({ success: false, message: 'Dữ liệu Excel rỗng!' });

    const raw = await getRawData();
    if (!raw.tuyenList) raw.tuyenList = {};
    if (!Array.isArray(raw.danhSachXe)) raw.danhSachXe = [];

    const lines = rawText.split('\n');
    let currentMaTuyen = '';
    const importedCars = [];
    let soTuyenMoi = 0;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const parts = line.split('\t').map(p => p.trim());

      // Nhận diện dòng tiêu đề tuyến: "Tuyến 22B: BẾN XE GIÁP BÁT - ĐÔ NGHĨA (HÀ ĐÔNG)"
      const matchTuyen = line.match(/^Tuyến\s+([0-9A-Za-z]+)\s*[:\-]?\s*(.*)/i);
      if (matchTuyen) {
        currentMaTuyen = matchTuyen[1].toUpperCase();
        let tenLoTrinh = matchTuyen[2] || '';
        tenLoTrinh = tenLoTrinh.replace(/\t.*$/, '').trim();

        // Nếu mã tuyến chưa có trong DB -> Tự động mở tuyến mới
        if (!raw.tuyenList[currentMaTuyen]) {
          let dauA = '', dauB = '';
          const partsLoTrinh = tenLoTrinh.split('-');
          if (partsLoTrinh.length >= 2) {
            dauA = partsLoTrinh[0].trim();
            dauB = partsLoTrinh[1].trim();
          }

          raw.tuyenList[currentMaTuyen] = {
            maTuyen: currentMaTuyen,
            tenTuyen: tenLoTrinh ? `${currentMaTuyen}. ${tenLoTrinh}` : `Tuyến ${currentMaTuyen}`,
            xn: 'Transerco',
            dauA: dauA,
            dauB: dauB,
            soXeVd: 0,
            soXeKh: 0,
            loaiXe: '',
            sucChua: '',
            status: 'active'
          };
          soTuyenMoi++;
        }
        continue;
      }

      // Nhận diện dòng phương tiện (biển số 29B, 29F, 29E, ...)
      const bks = parts[0] || '';
      if (/^29[A-Z0-9\-\.]+$/i.test(bks) && currentMaTuyen) {
        const nhanHieu = parts[1] || '';
        const chungLoai = parts[2] || '';
        const namSx = parts[3] || '';
        const sucChua = parts[4] || '';

        importedCars.push({
          bks: bks.toUpperCase(),
          maTuyen: currentMaTuyen,
          nhanHieu,
          chungLoai,
          namSx,
          sucChua
        });

        // Điền gợi ý thông số xe vào tuyến nếu tuyến chưa có
        if (raw.tuyenList[currentMaTuyen]) {
          if (!raw.tuyenList[currentMaTuyen].loaiXe && nhanHieu) {
            raw.tuyenList[currentMaTuyen].loaiXe = `${nhanHieu} ${chungLoai}`.trim();
          }
          if (!raw.tuyenList[currentMaTuyen].sucChua && sucChua) {
            raw.tuyenList[currentMaTuyen].sucChua = `${sucChua} chỗ`;
          }
        }
      }
    }

    if (importedCars.length === 0) {
      return res.status(400).json({ success: false, message: 'Không tìm thấy dòng biển số xe nào hợp lệ trong dữ liệu dán!' });
    }

    // Ghép vào danh sách xe (ghi đè xe trùng BKS hoặc thêm mới)
    const carMap = new Map();
    raw.danhSachXe.forEach(c => carMap.set(c.bks, c));
    importedCars.forEach(c => carMap.set(c.bks, c));
    raw.danhSachXe = Array.from(carMap.values());

    // Tự động đếm lại số xe kế hoạch (soXeKh) cho TẤT CẢ các tuyến
    const countMap = {};
    raw.danhSachXe.forEach(c => {
      const ma = String(c.maTuyen || '').toUpperCase();
      countMap[ma] = (countMap[ma] || 0) + 1;
    });

    for (let k in raw.tuyenList) {
      const ma = String(raw.tuyenList[k].maTuyen || k).toUpperCase();
      if (countMap[ma] !== undefined) {
        raw.tuyenList[k].soXeKh = countMap[ma];
      }
    }

    await saveRawData(raw);

    res.json({
      success: true,
      message: `Đã nạp ${importedCars.length} xe! Tự động tạo ${soTuyenMoi} tuyến mới và cập nhật chính xác số xe kế hoạch.`
    });
  } catch (err) {
    console.error(err);
    res.status(500).json({ success: false, message: 'Lỗi nạp Excel: ' + err.message });
  }
});

// 12. API ĐIỀU CHUYỂN XE SANG TUYẾN KHÁC
app.post('/api/dieu-chuyen-xe', async (req, res) => {
  try {
    const { bks, tuyenMoi } = req.body;
    if (!bks || !tuyenMoi) {
      return res.status(400).json({ success: false, message: 'Thiếu biển số xe hoặc tuyến mới!' });
    }

    const raw = await getRawData();
    const danhSachXe = raw.danhSachXe || [];
    const idx = danhSachXe.findIndex(x => x.bks.toUpperCase() === bks.toUpperCase());

    if (idx === -1) {
      return res.status(404).json({ success: false, message: 'Không tìm thấy xe này trong cơ sở dữ liệu!' });
    }

    const tuyenCu = danhSachXe[idx].maTuyen;
    const tuyenMoiChuan = tuyenMoi.toUpperCase();

    if (tuyenCu.toUpperCase() === tuyenMoiChuan) {
      return res.json({ success: false, message: 'Xe hiện tại đã thuộc tuyến này rồi!' });
    }

    // Đổi tuyến cho xe
    danhSachXe[idx].maTuyen = tuyenMoiChuan;

    // Tự động tính toán lại số xe kế hoạch của tất cả các tuyến
    const countMap = {};
    danhSachXe.forEach(c => {
      const ma = String(c.maTuyen || '').toUpperCase();
      countMap[ma] = (countMap[ma] || 0) + 1;
    });

    if (raw.tuyenList) {
      for (let k in raw.tuyenList) {
        const ma = String(raw.tuyenList[k].maTuyen || k).toUpperCase();
        raw.tuyenList[k].soXeKh = countMap[ma] || 0;
      }
    }

    await saveRawData(raw);
    res.json({
      success: true,
      message: `Đã điều chuyển xe [${bks}] từ tuyến ${tuyenCu} sang tuyến ${tuyenMoiChuan}! Số xe kế hoạch đã tự động cân đối.`
    });
  } catch (err) {
    console.error(err);
    res.status(500).json({ success: false, message: 'Lỗi điều chuyển: ' + err.message });
  }
});
